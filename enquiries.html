<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Table Reservations & Bulk Event Catering Enquiries</title>
    <meta name="description" content="Planning a student party or big family cluster table event? Complete our quick online booking form to secure bulk catering packages and group seating layouts 48 hours in advanced.">
    <meta name="keywords" content="book a table flame burger, bulk burger catering Pretoria, event venue booking Johannesburg, student discount group reservations, custom burger ordering">
    <link rel="stylesheet" href="css_assets/myfirststyle.css">
</head>
<body>

    <header>
        <img src="_images/rethabile-flame-burger-logo.png" alt="Rethabile's Flame Burger official restaurant brand logo seal featuring a flame-grilled icon emblem.">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Menu & Products</a></li>
                <li><a href="enquiries.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--TITLE BANNER ACCENT CARD-->
        <div class="content-box" style="background-color: #D32F2F; color: white; text-align: center;">
            <h1>ENQUIRIES & PARTY BOOKINGS</h1>
            <p style="color: white; margin-bottom: 0; padding-top: 5px;">Planning a big visit or need custom catering updates? Complete our quick booking form below.</p>
        </div>

        <!--COMPREHENSIVE INTERACTIVE BOOKING PANEL-->
        <div class="content-box">
            <h2 style="text-align: center; margin-bottom: 20px;">📋 Secure Your Reservation</h2>
            
            <form>
                <div>
                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div>
                    <label>Email Address:</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div>
                    <label>Booking Type:</label>
                    <select>
                        <option value="">Select an option...</option>
                        <option>Group Table Reservation (10+ guests)</option>
                        <option>Bulk Event Catering Order (15+ items)</option>
                        <option>General Menu Enquiry</option>
                    </select>
                </div>

                <div>
                    <label>Additional Details / Special Requests:</label>
                    <textarea rows="4" placeholder="Tell us more about your event size, date, or preferred menu choices..."></textarea>
                </div>

                <button type="submit">Submit Booking Request</button>
            </form>
        </div>
    </main>

    <footer>
        <p>
            <script>
                var myDate = new Date();
                document.write(myDate.getFullYear());
                document.write(" Rethabile's Flame Burger &copy; - All Rights Reserved. ");
                var myLastModifiedDate = new Date(document.lastModified);
                document.write("The Last Modified Date: " + myLastModifiedDate.toDateString());
            </script>
        </p>
    </footer>

    <!--INTERACTIVE GALLERY LIGHTBOX VIEW PANEL-->
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close">×</span>
        <img id="lightbox-img" class="lightbox-content" src="" alt="Popup Preview">
    </div>

    <script src="script.js"></script>
</body>
</html>
