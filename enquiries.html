<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rethabile's Flame Burger | Enquiries</title>
    <link rel="stylesheet" href="css_assets/style.css">
</head>
<body>

    <header>
        <img src="_images/logo.png" alt="Rethabile's Flame Burger Logo">
        <nav>
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Menu & Products</a></li>
                <li><a href="enquiries.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ol>
        </nav>
    </header>

    <main class="container">
        <h1>Table & Event Catering Reservation</h1>
        <form action="#" method="POST">
            <div class="form-field">
                <label for="name">Customer Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-field">
                <label for="reservation-type">Booking Objective:</label>
                <select id="reservation-type" name="reservation-type">
                    <option value="dinein">Standard Table Reservation (Lounge Space)</option>
                    <option value="collect">Click-and-Collect Retail Order Hub Pickup</option>
                    <option value="catering">Custom Party Catering Event Request</option>
                </select>
            </div>
            <div class="form-field">
                <label for="party-count">Total Guests / Servings:</label>
                <select id="party-count" name="party-count">
                    <option value="1-2">1 - 2 Diners</option>
                    <option value="3-4">3 - 4 Diners</option>
                    <option value="large">5+ Group Booking</option>
                </select>
            </div>
        
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Rethabile's Flame Burger. All Rights Reserved.</p>
    </footer>

</body>
</html>
